# DO NOT EDIT -- overwritten on every update.
#
# Workflow customization surface for bmad-create-pr. Mirrors the
# agent customization shape under the [workflow] namespace.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = []

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "Nunca abras un PR contra main."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = []

# Path to the PR body template this workflow fills in.
# Scalar: override wins. Point this elsewhere if the template moves.

pr_template = "{project-root}/.github/pull_request_template.md"

# Path to the commit-message standard this workflow follows when it has to
# create the commit for the PR (Conventional Commits + reglas de Chris Beams).
# Scalar: override wins. Point this elsewhere if the standard moves.

commit_template = "{project-root}/.github/commit_template.md"

# Branch every PR targets. This is the integration branch, never `main`.
# Scalar: override wins. This project already renamed it once (DEV -> development),
# so if it moves again this single value is the only thing that needs to change.

base_branch = "development"

# PR title format. `{story_key}` and `{story_title}` are interpolated at runtime.
# When there is no story, the workflow derives a Conventional Commit title from
# the branch commits instead and ignores this format.
# Scalar: override wins.

title_format = "feat: {story_key} - {story_title}"

# Whether the "create as draft" option is the pre-selected default at the
# publish gate. The user is always asked either way.
# Scalar: override wins.

draft_default = false

# Verification commands offered to the user in step 2, used as the evidence
# for the "Tests pasan localmente" and "Lint / type-check sin errores" boxes
# of the PR checklist.
#
# Taken verbatim from `.github/workflows/ci.yml` so local evidence and CI agree.
# Array of tables keyed by `id`: an override replaces the entry with the same
# `id` and appends new ones, so a team can swap one command without restating
# the whole list.
#
# Fields:
#   id      — stable key. A `*-tests` id feeds the tests box; `*-lint` the lint box.
#   label   — shown to the user at the gate.
#   paths   — the command is only offered when the diff touches these globs.
#   cwd     — working directory, relative to {project-root}.
#   command — run verbatim. Must be non-mutating.
#
# NOTE: `ci.yml` has no frontend test job. A frontend-only change therefore has
# no possible evidence for "Tests pasan localmente" — leave that box unticked
# with that reason. Do not fake it.

[[workflow.verify_commands]]
id = "backend-lint"
label = "Backend — ruff check, ruff format --check, mypy, lint-imports"
paths = ["backend/**"]
cwd = "backend"
command = "uv run ruff check . && uv run ruff format --check . && uv run mypy . && uv run lint-imports"

[[workflow.verify_commands]]
id = "backend-tests"
label = "Backend — pytest (incluye tests/architecture)"
paths = ["backend/**"]
cwd = "backend"
command = "uv run pytest --cov=app --cov-report=term-missing"

[[workflow.verify_commands]]
id = "frontend-lint"
label = "Frontend — ESLint, tsc --noEmit, Prettier check"
paths = ["frontend/**"]
cwd = "frontend"
command = "npm run lint && npx tsc --noEmit && npm run format:check"
