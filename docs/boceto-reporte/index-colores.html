<!doctype html>
<html lang="en" data-theme="dark" data-pal="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentReach report (colors sketch, fake data)</title>
<style>
/* ===== Base palette per theme. Brand colors are kept exactly in dark. ===== */
:root{
  --font-ui:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  /* brand */
  --bg:#0B1114;--surface:#121C20;--inset:#0F181B;--line:#2F4044;--line2:#4A5C5F;
  --text:#EAF4F2;--soft:#A9BDB9;--mute:#7C928E;--ctl:#7C928E;
  --mint:#3DF5D0;--mint-t:#3DF5D0;--mint-bg:#0E2B2A;--onmint:#0B1114;
  /* semantic hues: t = text/icon, c = border/fill, bg = tint (opaque) */
  --red-t:#FF6B6B;--red-c:#FF5A5F;--red-bg:#2E1B1F;
  --amber-t:#FFB224;--amber-c:#FFB224;--amber-bg:#2B2314;
  --violet-t:#B9A2FF;--violet-c:#9F84F5;--violet-bg:#241F38;
  --blue-t:#6DB6FF;--blue-c:#4A9CF0;--blue-bg:#14273B;
  --gray-t:#A9BDB9;--gray-c:#7C928E;--gray-bg:#1A272B;
  --focus:#3DF5D0;--shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --hero-bg:var(--bg);
}
:root[data-theme="light"]{
  --bg:#DFF5EF;--surface:#FFFFFF;--inset:#F0FBF8;--line:#9CC8BE;--line2:#5F8F84;
  --text:#0B1114;--soft:#2A4540;--mute:#46635E;--ctl:#46635E;
  --mint:#00806B;--mint-t:#005F4D;--mint-bg:#D2F5EA;--onmint:#FFFFFF;
  --red-t:#B3201A;--red-c:#D92D20;--red-bg:#FFE6E3;
  --amber-t:#7A4300;--amber-c:#B86E00;--amber-bg:#FFEFC7;
  --violet-t:#5A3DC0;--violet-c:#7B5CE0;--violet-bg:#ECE6FF;
  --blue-t:#0A58A8;--blue-c:#1E78D2;--blue-bg:#DCEBFF;
  --gray-t:#3A524D;--gray-c:#6C8580;--gray-bg:#E8F0EE;
  --focus:#005F4D;--shadow:0 2px 6px rgba(7,52,45,.16);
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#DFF5EF;--surface:#FFFFFF;--inset:#F0FBF8;--line:#9CC8BE;--line2:#5F8F84;
    --text:#0B1114;--soft:#2A4540;--mute:#46635E;--ctl:#46635E;
    --mint:#00806B;--mint-t:#005F4D;--mint-bg:#D2F5EA;--onmint:#FFFFFF;
    --red-t:#B3201A;--red-c:#D92D20;--red-bg:#FFE6E3;
    --amber-t:#7A4300;--amber-c:#B86E00;--amber-bg:#FFEFC7;
    --violet-t:#5A3DC0;--violet-c:#7B5CE0;--violet-bg:#ECE6FF;
    --blue-t:#0A58A8;--blue-c:#1E78D2;--blue-bg:#DCEBFF;
    --gray-t:#3A524D;--gray-c:#6C8580;--gray-bg:#E8F0EE;
    --focus:#005F4D;--shadow:0 2px 6px rgba(7,52,45,.16);
  }
}
/* ===== Roles. Red = verified. ===== */
:root{
  --ver-t:var(--red-t);--ver-c:var(--red-c);--ver-bg:var(--red-bg);
  --pot-t:var(--amber-t);--pot-c:var(--amber-c);--pot-bg:var(--amber-bg);
  --hyp-t:var(--gray-t);--hyp-c:var(--gray-c);--hyp-bg:var(--gray-bg);
  --unc-t:var(--violet-t);--unc-c:var(--violet-c);--unc-bg:var(--violet-bg);
  --info-t:var(--blue-t);--info-c:var(--blue-c);--info-bg:var(--blue-bg);
  --ok-t:var(--mint-t);--ok-c:var(--mint);--ok-bg:var(--mint-bg);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--font-ui);overflow-wrap:anywhere}
code,.mono{font-family:var(--font-mono);font-size:.86em}
a{color:var(--mint-t)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--mint);color:var(--onmint);padding:8px 14px;border-radius:6px;z-index:10;font-weight:700}
.skip:focus{left:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* top bar: always the brand dark surface, in both themes */
header.top{background:#0B1114;color:#EAF4F2;border-bottom:3px solid #3DF5D0}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
.wm{font-weight:700;font-size:1.35rem;letter-spacing:.06em;line-height:1}
.wm b{color:#3DF5D0;font-weight:700}
.brand small{display:block;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#A9BDB9;margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #4A5C5F;border-radius:8px;overflow:hidden}
.seg button{background:transparent;color:#A9BDB9;border:0;padding:8px 12px;min-height:40px;font:inherit;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:#3DF5D0;color:#0B1114;font-weight:700}
.btn{background:transparent;color:var(--text);border:1px solid var(--ctl);border-radius:8px;padding:8px 12px;min-height:40px;font:inherit;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--mint)}
header.top .btn{color:#EAF4F2;border-color:#4A5C5F}
header.top .btn:hover{border-color:#3DF5D0}
header.top :focus-visible{outline-color:#3DF5D0}

/* hero */
.hero{padding:28px 0 8px}
.hero h1{margin:0 0 6px;font-size:clamp(1.6rem,4.2vw,2.3rem);line-height:1.15;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--soft);font-size:.92rem;margin:0;padding:0;list-style:none}
.meta b{color:var(--text);font-weight:700}
.note{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;border:1.5px solid var(--ok-c);border-radius:10px;background:var(--ok-bg)}
.note svg{flex:none;margin-top:2px;color:var(--ok-t)}
.note p{margin:0}
.note strong{color:var(--ok-t)}
.note.info{border-color:var(--info-c);background:var(--info-bg)}
.note.info svg,.note.info strong{color:var(--info-t)}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat{--t:var(--text);--c:var(--line);--b:var(--surface);background:var(--b);border:1.5px solid var(--c);border-top-width:6px;border-radius:12px;padding:12px 16px 14px;box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;display:block;text-decoration:none}
.stat:hover{filter:brightness(1.06)}
.stat[aria-pressed="true"]{outline:3px solid var(--text);outline-offset:2px}
.stat .n{font-size:2.4rem;font-weight:700;line-height:1;display:block;color:var(--t)}
.stat .l{display:flex;align-items:center;gap:7px;font-weight:700;margin-top:6px;color:var(--t)}
.stat .d{display:block;color:var(--soft);font-size:.84rem;margin-top:2px}
.stat.confirmed{--t:var(--ver-t);--c:var(--ver-c);--b:var(--ver-bg)}
.stat.potential{--t:var(--pot-t);--c:var(--pot-c);--b:var(--pot-bg)}
.stat.hypothesis{--t:var(--hyp-t);--c:var(--hyp-c);--b:var(--hyp-bg)}
.stat.hypothesis{border-style:dotted;border-top-style:solid}
.stat.unchecked{--t:var(--unc-t);--c:var(--unc-c);--b:var(--unc-bg);border-style:dashed;border-top-style:solid}
.stat.potential{border-style:solid}
.bars{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--inset);border:1px solid var(--line);margin:-6px 0 22px}
.bars i{display:block;height:100%}
.bars .c{background:var(--ver-c)}
.bars .p{background:repeating-linear-gradient(135deg,var(--pot-c) 0 4px,var(--surface) 4px 8px)}
.bars .h{background:radial-gradient(circle,var(--hyp-c) 1.2px,transparent 1.6px) 0 0/6px 6px,var(--hyp-bg)}

/* legend */
.legend{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;margin:0 0 22px;box-shadow:var(--shadow)}
.legend summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border:1.5px solid var(--ctl);border-radius:6px;font-family:var(--font-mono)}
.legend[open] summary::before{content:"\2212"}
.legend .body{padding:0 16px 16px}
.legend p.lead{margin:0 0 10px;color:var(--soft);font-size:.92rem}
.lg{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lg li{display:grid;grid-template-columns:minmax(150px,200px) minmax(90px,130px) 1fr;gap:6px 14px;align-items:center;padding:8px 10px;background:var(--inset);border-radius:8px;border:1px solid var(--line)}
.lg .cn{font-size:.84rem;color:var(--soft)}
.lg .ds{font-size:.9rem}
.lg .ds b{display:block}

/* filters */
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.frow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.f label{display:block;font-size:.78rem;color:var(--soft);margin-bottom:3px;font-weight:700}
.f input,.f select{width:100%;min-height:44px;background:var(--surface);color:var(--text);border:1.5px solid var(--ctl);border-radius:8px;padding:8px 10px;font:inherit}
.f input::placeholder{color:var(--mute)}
.count{margin:10px 0 0;color:var(--soft);font-size:.9rem}

/* cards */
main h2{font-size:1.3rem;margin:26px 0 12px}
.cards{display:grid;gap:16px;margin-bottom:28px}
.card{--c:var(--ver-c);--b:var(--ver-bg);background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.card[data-level="confirmed"]{--c:var(--ver-c)}
.card[data-level="potential"]{--c:var(--pot-c);border-left-style:solid}
.card[data-level="hypothesis"]{--c:var(--hyp-c);border-left-style:dotted}
.card header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.card[data-level="confirmed"] header{background:var(--ver-bg)}
.card h3{margin:0;font-size:1.04rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fid{color:var(--mute);font-size:.82rem;font-weight:700;font-family:var(--font-mono)}
.badge{--t:var(--text);--c:currentColor;--b:transparent;display:inline-flex;align-items:center;gap:6px;color:var(--t);background:var(--b);border:1.5px solid var(--c);border-radius:999px;padding:2px 11px 2px 8px;font-weight:700;font-size:.82rem;white-space:nowrap}
.badge.confirmed{--t:var(--ver-t);--c:var(--ver-c);--b:var(--ver-bg);border-width:2.5px}
.badge.potential{--t:var(--pot-t);--c:var(--pot-c);--b:var(--pot-bg)}
.badge.hypothesis{--t:var(--hyp-t);--c:var(--hyp-c);--b:var(--hyp-bg);border-style:dotted;border-width:2px}
.badge.unchecked{--t:var(--unc-t);--c:var(--unc-c);--b:var(--unc-bg);border-style:dashed}
.badge.ok{--t:var(--ok-t);--c:var(--ok-c);--b:var(--ok-bg)}
.badge.info{--t:var(--info-t);--c:var(--info-c);--b:var(--info-bg)}
.tag{border:1px solid var(--line2);color:var(--soft);border-radius:6px;padding:1px 8px;font-size:.78rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}
dl.fields{margin:0;padding:6px 16px 14px;display:grid;grid-template-columns:minmax(150px,210px) 1fr;column-gap:16px}
dl.fields dt,dl.fields dd{padding:9px 0;border-bottom:1px solid var(--line);margin:0}
dl.fields dt:nth-last-of-type(1),dl.fields dd:last-of-type{border-bottom:0}
dt{color:var(--soft);font-size:.82rem;font-weight:700;display:flex;gap:8px;align-items:baseline}
dt .no{color:var(--mute);font-variant-numeric:tabular-nums}
.act{display:flex;gap:8px;border-left:3px solid var(--mint);padding-left:10px;color:var(--text)}
.act svg{flex:none;margin-top:3px;color:var(--mint-t)}
.out{font-weight:700;color:var(--text);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px;text-decoration-color:var(--mute)}
.in{font-weight:700;color:var(--soft)}
.empty{padding:28px;text-align:center;border:1.5px dashed var(--line2);border-radius:12px;color:var(--soft)}

/* limits */
.limits{background:var(--unc-bg);border:1.5px dashed var(--unc-c);border-left:8px dashed var(--unc-c);border-radius:12px;padding:6px 18px 16px;margin:12px 0 40px}
.limits h2{margin:14px 0 4px;color:var(--unc-t)}
.limits>p{margin:0 0 10px;color:var(--soft)}
.limits ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.limits li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.limits li svg{color:var(--unc-t);margin-top:3px}
.limits li b{display:block}
.limits li span{color:var(--soft);font-size:.92rem}
footer{border-top:1px solid var(--line);padding:18px 0 36px;color:var(--soft);font-size:.88rem}

@media (max-width:860px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .frow{grid-template-columns:1fr 1fr}
  .frow .f:first-child{grid-column:1/-1}
  .filters{position:static}
  .lg li{grid-template-columns:1fr 1fr}
  .lg .ds{grid-column:1/-1}
}
@media (max-width:600px){
  dl.fields{grid-template-columns:1fr}
  dl.fields dt{border-bottom:0!important;padding:10px 0 0}
  dl.fields dd{padding-top:2px}
  .stat .n{font-size:1.9rem}
  .frow{grid-template-columns:1fr}
  .lg li{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{.filters,.tools{display:none}}
</style>
</head>

</div>
<footer><div class="wrap" data-i="foot"></div></footer>

var lang="en", theme="dark", pal="A";

function t(){return UI[lang]}

function badge(l,txt){return '<span class="badge '+l+'">'+ICON[l==="ok"||l==="info"?l:l]+esc(txt||t().lvl[l])+'</span>'}

function renderStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(function(e){var k=e.getAttribute("data-i");if(t()[k]!==undefined)e.textContent=t()[k]});

    var n=l==="unchecked"?LIM.en.length:c[l];

     ? '<a class="stat unchecked" href="#limh"><span class="n">'+n+'</span><span class="l">'+ICON[l]+esc(t().lvl[l])+'</span><span class="d">'+esc(t().lvlD[l])+'</span></a>'
     : '<button type="button" class="stat '+l+'" data-lv="'+l+'" aria-pressed="'+(lvlFilter===l)+'"><span class="n">'+n+'</span><span class="l">'+ICON[l]+esc(t().lvl[l])+'</span><span class="d">'+esc(t().lvlD[l])+'</span></button>';
  });
  $("#summary").innerHTML=h;

  $("#bars").innerHTML='<i class="c" style="width:'+c.confirmed/tot*100+'%"></i><i class="p" style="width:'+c.potential/tot*100+'%"></i><i class="h" style="width:'+c.hypothesis/tot*100+'%"></i>';

  $("#legLead").textContent=t()["legLead"+pal];
  var rows=["confirmed","potential","hypothesis","unchecked","ok","info","action"];
  $("#lg").innerHTML=rows.map(function(r){
    var isLvl=r!=="ok"&&r!=="info"&&r!=="action";
    var name=isLvl?t().lvl[r]:t().role[r];
    var chip=r==="action"
      ? '<span class="badge ok" style="border-style:solid">'+ICON.action+esc(name)+'</span>'
      : '<span class="badge '+r+'">'+ICON[r]+esc(name)+'</span>';
    return '<li><span>'+chip+'</span><span class="cn">'+esc(t().colN[pal][r])+'</span><span class="ds">'+esc(t().roleD[r])+'</span></li>';

  fillSel("#ft",["all"].concat(Object.keys(TYPES)),function(v){return v==="all"?t().all:TYPES[v][lang]});

function fillSel(sel,vals,lab){
  var el=$(sel),cur=el.value||"all";
  el.innerHTML=vals.map(function(v){return '<option value="'+esc(v)+'">'+esc(lab(v))+'</option>'}).join("");
  el.value=vals.indexOf(cur)>=0?cur:"all";
}
function renderCards(){
  var q=$("#q").value.trim().toLowerCase(),fl=$("#fl").value,fa=$("#fa").value,ft=$("#ft").value;
  lvlFilter=fl;
  document.querySelectorAll(".stat[data-lv]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lv")===fl)});
  var L=t(),out=D.filter(function(f){
    if(fl!=="all"&&f.lv!==fl)return false;
    if(fa!=="all"&&f.ag!==fa)return false;
    if(ft!=="all"&&f.ty!==ft)return false;
    if(q){var x=f[lang],hay=(f.id+" "+x.title+" "+x.loc+" "+x.what+" "+x.plat+" "+f.ag).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true});
  $("#count").textContent=L.showing.replace("{a}",out.length).replace("{b}",D.length);
  if(!out.length){$("#cards").innerHTML='<div class="empty">'+esc(L.none)+'</div>';return}
  $("#cards").innerHTML=out.map(function(f){
    var x=f[lang];
    var vals=[
      '<code>'+esc(x.loc)+'</code>'+(x.ln?' <span class="tag">'+esc(L.line)+' '+x.ln+'</span>':''),
      esc(x.what),
      badge(f.lv)+' '+esc(x.why),
      '<span class="'+(x.unrel?'out':'in')+'">'+esc(x.unrel?L.yes:L.no)+'.</span> '+esc(x.unrelT),
      esc(x.plat),
      esc(x.stance),
      '<div class="act">'+ICON.action+'<span>'+esc(x.do)+'</span></div>',
      esc(x.mean)];
    var dl=L.fields.map(function(n,i){return '<dt><span class="no">'+(i+1)+'</span>'+esc(n)+'</dt><dd>'+vals[i]+'</dd>'}).join("");
    return '<article class="card" data-level="'+f.lv+'" aria-labelledby="h-'+f.id+'"><header><h3 id="h-'+f.id+'"><span class="fid">'+f.id+'</span>'+esc(x.title)+'</h3><div class="tags">'+badge(f.lv)+'<span class="tag">'+esc(f.ag)+'</span><span class="tag">'+esc(TYPES[f.ty][lang])+'</span></div></header><dl class="fields">'+dl+'</dl></article>';
  }).join("");
}
function all(){renderStatic();renderCards()}

$("#lang-es").onclick=function(){lang="es";all()};
$("#theme").onclick=function(){theme=theme==="auto"?"dark":theme==="dark"?"light":"auto";document.documentElement.setAttribute("data-theme",theme);renderStatic()};
["#q","#fl","#fa","#ft"].forEach(function(s){$(s).addEventListener("input",renderCards)});
$("#reset").onclick=function(){$("#q").value="";$("#fl").value="all";$("#fa").value="all";$("#ft").value="all";renderCards()};
$("#summary").addEventListener("click",function(e){var b=e.target.closest(".stat[data-lv]");if(!b)return;var v=b.getAttribute("data-lv");$("#fl").value=($("#fl").value===v)?"all":v;renderCards()});
(function(){var th=location.hash.match(/theme=(dark|light)/),lg=location.hash.match(/lang=(es|en)/);
 if(th){theme=th[1];document.documentElement.setAttribute("data-theme",theme)}
 if(lg){lang=lg[1]}})();
all();
})();
</script>
</body>
</html>
